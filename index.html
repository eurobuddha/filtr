<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      /* Theme bootstrap — must run before first paint, or a light-mode user
         gets a dark flash while the render-blocking stylesheet applies the
         dark defaults. Classic (non-module) on purpose: module scripts are
         implicitly deferred and would land too late. The key and the fallback
         are duplicated from src/state/theme.ts by necessity — keep in sync. */
      try {
        var m = localStorage.getItem('filtr.theme.v1')
        if (m !== 'light' && m !== 'dark')
          m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = m
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta
      name="description"
      content="filtr — free WebGL2-powered ASCII, dithering, halftone and retro effects for images, video and webcam, in real time."
    />
    <link rel="canonical" href="https://filtr.org.uk/" />

    <!-- Open Graph. Crawlers do not resolve relative image paths - keep absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="filtr" />
    <meta property="og:url" content="https://filtr.org.uk/" />
    <meta property="og:title" content="filtr" />
    <meta
      property="og:description"
      content="Free WebGL2-powered ASCII, dithering and retro effects, in real time."
    />
    <meta property="og:image" content="https://filtr.org.uk/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="filtr — ASCII, dithering, halftone and retro effects" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="filtr" />
    <meta
      name="twitter:description"
      content="Free WebGL2-powered ASCII, dithering and retro effects, in real time."
    />
    <meta name="twitter:image" content="https://filtr.org.uk/preview.png" />
    <meta name="twitter:image:alt" content="filtr — ASCII, dithering, halftone and retro effects" />

    <title>filtr — retro image &amp; video effects</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
